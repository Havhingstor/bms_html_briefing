<table width=100%>
      <tr>
<th class="header clickable" onclick="toggleVisHeader(this)" id="airbase_header"><span class="arrow">▼</span>Airbase</th>
  </tr>
</table>
<table width=100% id="airbase" class="hidable">
    <colgroup>
        <col style="width:25%;">
        <col style="width:25%;">
        <col style="width:25%;">
        <col style="width:25%;">
    </colgroup>
    <tbody>
        <tr>
          <th>Loc</th>
          <th>Ground</th>
          <th>Tower</th>
          <th>Approach</th>
        </tr>
        {% for i in range(3)%}
        <tr>
            <td>{{ airbases[i].agency }}</td>
            <td>{{ airbases[i].ground }}</td>
            <td>{{ airbases[i].tower }}</td>
            <td>{{ airbases[i].approach }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
