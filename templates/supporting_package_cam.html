<style>
  tr.primary {
      font-weight: bold;
  }
  .cam-package-picker {
      float: right;
      font-weight: normal;
      display: inline-flex;
      align-items: center;
      gap: 0.35em;
  }
  .cam-package-picker input {
      width: 8.5em;
  }
  .cam-package-picker select {
      max-width: 14em;
  }
  @media print {
      .cam-package-picker {
          display: none !important;
      }
  }
</style>
<table width=100%>
      <tr>
<th class="header clickable" onclick="toggleVisHeader(this)" id="suppPackage_header"><span class="arrow">▼</span>Supporting package
  <span class="cam-package-picker" onclick="event.stopPropagation();" onmousedown="event.stopPropagation();">
    <input id="cam-support-package-query" class="interface-text-input" type="search" placeholder="# / role" title="Type to filter package list">
    <select id="cam-support-package-select" class="interface-select" aria-label="Supporting package" title="Select a package from the loaded save." {% if not package_options %}disabled{% endif %}>
      {% if package_options %}
      <option value="">No supporting package</option>
      {% for option in package_options %}
      <option value="{{option.index}}" data-search="{{option.search_text}}" {% if option.selected %}selected{% endif %}>{{option.label}}</option>
      {% endfor %}
      {% else %}
      <option value="">No CAM package loaded</option>
      {% endif %}
    </select>
  </span>
</th>
  </tr>
</table>
<table width=100% id="suppPackage" class="hidable">
    <colgroup>
        <col style="width:17%;">
        <col style="width:7%;">
        <col style="width:11%;">
        <col style="width:17%;">
        <col style="width:12%;">
        <col style="width:12%;">
        <col style="width:12%;">
        <col style="width:12%;">
    </colgroup>
    <thead>
        <tr>
            <th>Callsign</th>
            <th>Flt #</th>
            <th>Role</th>
            <th>Aircraft</th>
            <th class="nowrap">Takeoff</th>
            <th class="nowrap">Push</th>
            <th class="nowrap">TOT</th>
            <th>L16</th>
        </tr>
    </thead>
    <tbody>
    {% for row in support_package_rows %}
      <tr>
	{% for cell in row %}
	<td class="{% if loop.index0 in [4, 5, 6] %}nowrap{% endif %}">{{cell.value}}</td>
	{% endfor %}
      </tr>
    {% endfor %}
    </tbody>
</table>
